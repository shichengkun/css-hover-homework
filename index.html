<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 图形悬停效果</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #181922;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    /* 六个图形居中排列，小屏幕自动换行。 */
    .stage {
      width: min(100%, 1020px);
      min-height: 465px;
      padding: 50px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 38px;
    }
    .cube {
      --shadow-color: rgba(255, 99, 105, .35);
      position: relative;
      flex: 0 0 116px;
      height: 116px;
      background: linear-gradient(135deg, #ff9953, #ff5f6d);
      box-shadow: 0 10px 20px var(--shadow-color);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    /* 伪元素文字始终位于图形中心，悬停时显示。 */
    .cube::after {
      content: "hover";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .cube:hover, .cube:focus-visible {
      transform: translateY(-10px);
      /* 阴影的水平、垂直偏移量均变为 0。 */
      box-shadow: 0 0 20px var(--shadow-color);
    }
    .cube:hover::after, .cube:focus-visible::after { opacity: 1; }
    .cube:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
    .c2 {
      border-radius: 12px;
      background: linear-gradient(135deg, #2dcc91, #29cbb3);
      --shadow-color: rgba(41, 203, 179, .3);
    }
    .c3 {
      border-radius: 28px;
      background: linear-gradient(to bottom, #aa86a5, #716390);
      --shadow-color: rgba(140, 112, 160, .3);
    }
    .c4 {
      border-radius: 50%;
      background: linear-gradient(135deg, #f9d76a, #ffa285);
      --shadow-color: rgba(255, 170, 120, .3);
    }
    .c5 {
      border-radius: 8px;
      background: linear-gradient(135deg, #467e65, #4c6d80);
      --shadow-color: rgba(67, 119, 107, .25);
    }
    .c6 {
      border-radius: 50%;
      background: radial-gradient(circle at 65% 35%, #b18daf, #806b96);
      --shadow-color: rgba(155, 119, 169, .3);
    }
    @media (max-width: 600px) {
      .stage { padding: 40px 24px; gap: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cube, .cube::after { transition: none; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="六种 CSS 图形悬停效果">
    <div class="cube" tabindex="0" aria-label="橙红色方形"></div>
    <div class="cube c2" tabindex="0" aria-label="绿色圆角方形"></div>
    <div class="cube c3" tabindex="0" aria-label="紫色圆角方形"></div>
    <div class="cube c4" tabindex="0" aria-label="橙黄色圆形"></div>
    <div class="cube c5" tabindex="0" aria-label="青绿色圆角方形"></div>
    <div class="cube c6" tabindex="0" aria-label="紫色圆形"></div>
  </main>
</body>
</html>
